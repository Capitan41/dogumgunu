<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İyi Ki Doğdun 🎂</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding:40px;
}

button{
    padding:15px 30px;
    font-size:20px;
    cursor:pointer;
}

#kart{
    margin-top:30px;
    padding:20px;
    background:white;
    border-radius:15px;
    max-width:500px;
    margin-left:auto;
    margin-right:auto;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h1>🎂 İyi Ki Doğdun ELA🎂</h1>

<p>Kart aç ve sürprizleri keşfet 😎</p>

<button onclick="kartAc()">🎴 Kart Aç</button>

<div id="kart">
Henüz kart açılmadı.
<h2>Koleksiyon</h2>

<div id="sayac">
0 / 15 kart bulundu
</div>

<div id="koleksiyon">

</div>
</div>

<script>

cconst kartlar = [

    { nadirlik:"⚪ Common", yazi:"Ozan kartı 😭", resim:"!!OZAN!!.jpeg" },
    { nadirlik:"⚪ Common", yazi:"Sakin ol 😎", resim:"sakin.jpeg" },
    { nadirlik:"⚪ Common", yazi:"Kaftan momenti", resim:"kaftan.jpeg" },
    { nadirlik:"⚪ Common", yazi:"Otobüs anısı", resim:"otobus.jpeg" },
    { nadirlik:"⚪ Common", yazi:"Denizdeki topu izleme", resim:"DENİZDEKİ TOPU İZLEME.jpeg" },
    { nadirlik:"⚪ Common", yazi:"Kızma pls 🙏", resim:"KIZMA PLS.jpeg" },
    { nadirlik:"⚪ Common", yazi:"Anlaşılabilir.", resim:"ANLAŞILABİLİR.jpeg" },

    { nadirlik:"🔵 Rare", yazi:"GPT'nin önerdiği cosplay 💀", resim:"GPT NİN ÖNERDİĞİ COSPLAY.jpeg" },
    { nadirlik:"🔵 Rare", yazi:"Bilişim fareleri", resim:"bilişim fareleri.jpeg" },
    { nadirlik:"🔵 Rare", yazi:"Pembe çantalı Osman", resim:"PEMBE ÇANTALI OSMAN.jpeg" },
    { nadirlik:"🔵 Rare", yazi:"Büyük adam", resim:"BÜYÜK ADAM.jpeg" },

    { nadirlik:"🟣 Epic", yazi:"Dilfler Ela için", resim:"DİLFLER.jpeg" },
    { nadirlik:"🟣 Epic", yazi:"Kerem ifşa", resim:"KEREM İFŞA.jpeg" },

    { nadirlik:"🟡 Legendary", yazi:"Osman bagaja tıkılma", resim:"OSMAN BAGAJA TIKILMA.jpeg" },

    { nadirlik:"🌈 Mythic", yazi:"Osman doğum günü 🎂", resim:"OSMAN DOĞUM GÜNÜ.jpeg" },

    { nadirlik:"🌈 Secret", yazi:"Habere çıkma", resim:"HABERE ÇIKIİ.jpeg" }
];
let kalanKartlar = [...kartlar];
let bulunanKartlar = [];
    
function kartAc(){

    if(kalanKartlar.length === 0){
        document.getElementById("kart").innerHTML =
        "<h2>🎂 Tebrikler!</h2><p>Tüm kartları topladın.</p>";
        return;
    }

    let index =
    Math.floor(Math.random() * kalanKartlar.length);

    let secilen = kalanKartlar[index];

    kalanKartlar.splice(index,1);

    bulunanKartlar.push(secilen);

    document.getElementById("kart").innerHTML =
    "<h2>"+secilen.nadirlik+"</h2><p>"+secilen.yazi+"</p>";

    document.getElementById("koleksiyon").innerHTML =
    bulunanKartlar.map(k =>
    "<p>"+k.nadirlik+" - "+k.yazi+"</p>"
    ).join("");

    document.getElementById("sayac").innerHTML =
    bulunanKartlar.length + " / 15 kart bulundu";
}
</script>

</body>
</html>
