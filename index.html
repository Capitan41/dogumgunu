<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İyi Ki Doğdun ELA 🎂</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding:40px;
}

button{
    padding:15px 30px;
    font-size:20px;
    cursor:pointer;
}

#kart{
    margin-top:30px;
    padding:20px;
    background:white;
    border-radius:15px;
    max-width:500px;
    margin-left:auto;
    margin-right:auto;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h1>🎂 İyi Ki Doğdun ELA🎂</h1>

<p>Kart aç ve sürprizleri keşfet 😎</p>

<button onclick="kartAc()">🎴 Kart Aç</button>

<div id="kart">
Henüz kart açılmadı.
<h2>Koleksiyon</h2>

<div id="sayac">
0 / 15 kart bulundu
</div>

<div id="koleksiyon">

</div>
</div>

<script>

const kartlar = [
    { nadirlik:"⚪ Common", yazi:"Kart 1" },
    { nadirlik:"⚪ Common", yazi:"Kart 2" },
    { nadirlik:"⚪ Common", yazi:"Kart 3" },
    { nadirlik:"⚪ Common", yazi:"Kart 4" },
    { nadirlik:"⚪ Common", yazi:"Kart 5" },
    { nadirlik:"⚪ Common", yazi:"Kart 6" },
    { nadirlik:"⚪ Common", yazi:"Kart 7" },

    { nadirlik:"🔵 Rare", yazi:"Kart 8" },
    { nadirlik:"🔵 Rare", yazi:"Kart 9" },
    { nadirlik:"🔵 Rare", yazi:"Kart 10" },
    { nadirlik:"🔵 Rare", yazi:"Kart 11" },

    { nadirlik:"🟣 Epic", yazi:"Kart 12" },
    { nadirlik:"🟣 Epic", yazi:"Kart 13" },

    { nadirlik:"🟡 Legendary", yazi:"Kart 14" },

    { nadirlik:"🌈 Mythic", yazi:"Kart 15" }
];
let kalanKartlar = [...kartlar];
let bulunanKartlar = [];
    
function kartAc(){

    if(kalanKartlar.length === 0){
        document.getElementById("kart").innerHTML =
        "<h2>🎂 Tebrikler!</h2><p>Tüm kartları topladın.</p>";
        return;
    }

    let index =
    Math.floor(Math.random() * kalanKartlar.length);

    let secilen = kalanKartlar[index];

    kalanKartlar.splice(index,1);

    bulunanKartlar.push(secilen);

    document.getElementById("kart").innerHTML =
    "<h2>"+secilen.nadirlik+"</h2><p>"+secilen.yazi+"</p>";

    document.getElementById("koleksiyon").innerHTML =
    bulunanKartlar.map(k =>
    "<p>"+k.nadirlik+" - "+k.yazi+"</p>"
    ).join("");

    document.getElementById("sayac").innerHTML =
    bulunanKartlar.length + " / 15 kart bulundu";
}
</script>

</body>
</html>
